<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matchday – Live Football Scores</title>
<style>
  :root {
    --chalk: #F3F5EF;
    --paper: #FFFFFF;
    --ink: #17212B;
    --muted: #6B7780;
    --line: #DDE3D8;
    --pitch: #1D6B43;
    --live: #D7263D;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --chalk: #101814;
      --paper: #17221C;
      --ink: #EAF0EA;
      --muted: #93A39A;
      --line: #263329;
      --pitch: #4CB57F;
      --live: #FF5A6E;
      color-scheme: dark;
    }
  }

- { box-sizing: border-box; margin: 0; padding: 0; }
  body {
  font-family: “Avenir Next”, “Segoe UI”, system-ui, sans-serif;
  background: var(–chalk);
  color: var(–ink);
  line-height: 1.4;
  padding-bottom: 32px;
  }
  button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(–pitch); outline-offset: 2px; }

header {
background: var(–pitch);
color: #fff;
padding: 18px 16px 14px;
background-image: radial-gradient(circle at 100% 0, transparent 46px, rgba(255,255,255,.35) 47px, rgba(255,255,255,.35) 49px, transparent 50px);
}
header h1 { font-size: 1.5rem; letter-spacing: -0.02em; }
header p { font-size: .85rem; opacity: .85; }
#live-badge { margin-top: 4px; font-weight: 700; opacity: 1; min-height: 1.2em; }

main { max-width: 640px; margin: 0 auto; padding: 12px; }

/* –– Controls (search, date, filters) –– */
.controls { position: sticky; top: 0; z-index: 5; background: var(–chalk); padding: 4px 0 10px; }
.controls input[type=“search”], .controls select {
width: 100%; font: inherit; font-size: 16px; /* 16px stops iPhone zooming in */
padding: 11px 14px; border-radius: 10px; border: 1px solid var(–line);
background: var(–paper); color: var(–ink);
}
.controls .row { display: flex; gap: 8px; margin-top: 8px; }
.controls .row > * { flex: 1; }
.seg { display: flex; border: 1px solid var(–line); border-radius: 10px; overflow: hidden; background: var(–paper); }
.seg button { flex: 1; padding: 9px 4px; font-size: .85rem; font-weight: 600; color: var(–muted); }
.seg button[aria-pressed=“true”] { background: var(–ink); color: var(–chalk); }
.toggle {
padding: 10px 12px; border-radius: 10px; border: 1px solid var(–line);
background: var(–paper); font-size: .85rem; font-weight: 600; text-align: center;
}
.toggle[aria-pressed=“true”] { background: var(–live); border-color: var(–live); color: #fff; }

.notice { background: var(–paper); border: 1px dashed var(–line); border-radius: 8px; padding: 10px 12px; font-size: .85rem; color: var(–muted); margin-bottom: 10px; }

.league { margin-bottom: 18px; }
.league h2 { font-size: .95rem; margin: 0 4px 6px; color: var(–muted); font-weight: 600; }

.match {
display: grid; grid-template-columns: 54px 1fr 28px; gap: 8px; align-items: center;
width: 100%; text-align: left; background: var(–paper);
padding: 12px; border-bottom: 1px solid var(–line);
}
.match:first-of-type { border-radius: 10px 10px 0 0; }
.match:last-of-type { border-radius: 0 0 10px 10px; border-bottom: 0; }
.match:only-of-type { border-radius: 10px; }
.status { font-size: .8rem; font-weight: 700; color: var(–muted); }
.status.live { color: var(–live); }
.status.live::before { content: “”; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(–live); margin-right: 5px; animation: pulse 1.4s infinite; }
@keyframes pulse { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .status.live::before { animation: none; } }
.teams div { padding: 2px 0; }
.score div { font-variant-numeric: tabular-nums; font-weight: 800; text-align: right; padding: 2px 0; }

.back { padding: 8px 4px; color: var(–pitch); font-weight: 600; }
.card { background: var(–paper); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
.scoreboard { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; text-align: center; }
.scoreboard .big { font-size: 2.4rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.scoreboard .tname { font-weight: 700; }
.card h3 { font-size: .95rem; margin-bottom: 10px; }

.event { display: grid; grid-template-columns: 40px 1fr; padding: 8px 0; border-bottom: 1px solid var(–line); gap: 8px; }
.event:last-child { border-bottom: 0; }
.event .min { font-weight: 700; color: var(–muted); font-variant-numeric: tabular-nums; }
.event .team { color: var(–muted); }

.stat { margin: 12px 0; }
.stat .row { display: flex; justify-content: space-between; font-size: .85rem; font-weight: 600; }
.stat .label { color: var(–muted); font-weight: 400; }
.bar { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: var(–line); margin-top: 4px; }
.bar span { background: var(–pitch); }

.empty { text-align: center; color: var(–muted); padding: 40px 12px; }
.updated { text-align: center; color: var(–muted); font-size: .75rem; padding: 6px; }
</style>

</head>
<body>

<header>
  <h1>Matchday</h1>
  <p>Live scores and fixtures</p>
  <p id="live-badge"></p>
</header>

<main>
  <!-- The controls are written ONCE here and never redrawn.
       That is why typing in the search box does not lose focus,
       and why the league dropdown does not jump back to the start. -->
  <div class="controls" id="controls">
    <input id="search" type="search" placeholder="Search team or league" autocomplete="off">
    <div class="row">
      <div class="seg" id="dates">
        <button data-off="-1" aria-pressed="false">Yesterday</button>
        <button data-off="0" aria-pressed="true">Today</button>
        <button data-off="1" aria-pressed="false">Tomorrow</button>
      </div>
    </div>
    <div class="row">
      <button class="toggle" id="live-toggle" aria-pressed="false">Live only</button>
      <select id="league-select" aria-label="League"><option value="All">All leagues</option></select>
    </div>
  </div>

  <div id="app"></div>
  <p class="updated" id="updated"></p>
</main>

<script>
/* =====================================================
   PART 1: STATE (what the page remembers)
   ===================================================== */
const state = {
  offset: 0,            // -1 yesterday, 0 today, 1 tomorrow
  search: "",
  league: "All",
  liveOnly: false,
  openMatchId: null,
  matches: [],
  details: {},          // match id -> { events, stats }
  loading: true,
  error: false,
  lastJson: "",
  scrollY: 0,
};

const app = document.getElementById("app");
const controls = document.getElementById("controls");
const searchBox = document.getElementById("search");
const leagueSelect = document.getElementById("league-select");

/* =====================================================
   PART 2: DATA LAYER (talks to OUR backend)
   ===================================================== */
async function getJson(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(url + " failed: " + r.status);
  return r.json();
}

// Date text like 2026-10-17 for today + offset days
function dateFor(offset) {
  const d = new Date();
  d.setDate(d.getDate() + offset);
  const p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}

async function refresh() {
  const offset = state.offset;
  try {
    const data = await getJson("/api/matches?date=" + dateFor(offset));
    if (offset !== state.offset) return;          // user switched day while we waited
    state.error = false;
    state.matches = data;
  } catch (err) {
    console.warn(err);
    if (offset !== state.offset) return;
    state.error = true;                           // keep the old matches on screen if we have them
  }
  state.loading = false;
  document.getElementById("updated").textContent =
    "Updated " + new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });

  const json = JSON.stringify(state.matches);
  if (json !== state.lastJson || state.error) {   // only redraw when something changed
    state.lastJson = json;
    render();
  }
  if (state.openMatchId !== null) loadDetail(state.openMatchId);
}

async function loadDetail(id) {
  try {
    state.details[id] = await getJson("/api/match?id=" + id);
  } catch (err) {
    console.warn(err);
    state.details[id] = { events: [], stats: null };
  }
  if (state.openMatchId === id) render();
}

/* =====================================================
   PART 3: YOUR CODE (written by you)
   ===================================================== */
function liveCount(list) {
  return list.filter(match => match.status === "LIVE").length;
}

function updateBadge(list) {
  const count = liveCount(list);
  let text = "";

  if (count === 0) {
    text = "No matches live";
  } else if (count === 1) {
    text = "1 match live now";
  } else {
    text = `${count} matches live now`;
  }

  document.getElementById("live-badge").textContent = text;
}

/* =====================================================
   PART 4: HELPERS + RENDER FUNCTIONS
   ===================================================== */
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function kickoffText(m) {
  return new Date(m.kickoff).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
}

function liveLabel(m) { return m.short === "HT" ? "HT" : `${m.minute}'`; }

// Apply search + league + live filters
function visibleMatches() {
  const q = state.search.trim().toLowerCase();
  return state.matches.filter(m => {
    if (state.liveOnly && m.status !== "LIVE") return false;
    if (state.league !== "All" && m.league !== state.league) return false;
    if (q && !(`${m.home} ${m.away} ${m.league}`.toLowerCase().includes(q))) return false;
    return true;
  });
}

// Keep the league dropdown in step with today's matches,
// without resetting it while the person is using it.
let leagueKey = "";
function syncLeagueSelect() {
  const leagues = [...new Set(state.matches.map(m => m.league))];
  const key = leagues.join("|");
  if (key === leagueKey) return;
  leagueKey = key;
  if (state.league !== "All" && !leagues.includes(state.league)) state.league = "All";
  leagueSelect.innerHTML =
    `<option value="All">All leagues</option>` +
    leagues.map(l => `<option value="${esc(l)}">${esc(l)}</option>`).join("");
  leagueSelect.value = state.league;
}

function matchRow(m) {
  const status =
    m.status === "LIVE" ? `<span class="status live">${liveLabel(m)}</span>` :
    m.status === "FT"   ? `<span class="status">FT</span>` :
                          `<span class="status">${kickoffText(m)}</span>`;
  const showScore = m.status !== "NS";
  return `
    <button class="match" data-id="${m.id}">
      ${status}
      <div class="teams"><div>${esc(m.home)}</div><div>${esc(m.away)}</div></div>
      <div class="score">${showScore ? `<div>${m.hs}</div><div>${m.as}</div>` : ""}</div>
    </button>`;
}

function renderList() {
  if (state.loading) return `<p class="empty">Loading matches…</p>`;

  const notice = state.error
    ? `<p class="notice">Live scores could not be loaded just now. ${state.matches.length ? "Showing the last update." : "Please try again in a minute."}</p>`
    : "";

  const grouped = {};
  visibleMatches().forEach(m => (grouped[m.league] ||= []).push(m));

  const blocks = Object.entries(grouped).map(([league, ms]) =>
    `<section class="league"><h2>${esc(league)}</h2>${ms.map(matchRow).join("")}</section>`
  ).join("");

  const emptyText = state.search || state.liveOnly || state.league !== "All"
    ? "No matches found. Try clearing the search or filters."
    : "No matches for this day.";

  return notice + (blocks || (state.error && !state.matches.length ? "" : `<p class="empty">${emptyText}</p>`));
}

function eventIcon(t) { return t === "goal" ? "⚽" : t === "yellow" ? "🟨" : t === "red" ? "🟥" : "🔁"; }

function renderMatch(m) {
  const d = state.details[m.id] || {};
  const events = d.events;
  const stats = d.stats;

  const status = m.status === "LIVE" ? liveLabel(m) : m.status === "FT" ? "Full time" : `Kick-off ${kickoffText(m)}`;

  const eventsHtml = events === undefined ? `<p class="empty">Loading…</p>`
    : events.length
      ? [...events].reverse().map(e => `
          <div class="event"><span class="min">${e.min}'</span>
          <span>${eventIcon(e.type)} ${esc(e.player || "Unnamed player")} <span class="team">(${esc(e.team)})</span></span></div>`).join("")
      : `<p class="empty">No events yet.</p>`;

  const statsHtml = stats === undefined ? `<p class="empty">Loading…</p>`
    : stats
      ? Object.entries(stats).map(([label, [a, b]]) => `
          <div class="stat">
            <div class="row"><span>${a}</span><span class="label">${esc(label)}</span><span>${b}</span></div>
            <div class="bar"><span style="width:${a + b === 0 ? 50 : (a / (a + b)) * 100}%"></span></div>
          </div>`).join("")
      : `<p class="empty">${m.status === "NS" ? "Stats appear once the match starts." : "Stats are not available for this match."}</p>`;

  return `
    <button class="back" id="back">‹ All matches</button>
    <div class="card">
      <div class="scoreboard">
        <div class="tname">${esc(m.home)}</div>
        <div><div class="big">${m.status === "NS" ? "–" : `${m.hs} : ${m.as}`}</div>
        <div class="status ${m.status === "LIVE" ? "live" : ""}">${status}</div></div>
        <div class="tname">${esc(m.away)}</div>
      </div>
    </div>
    <div class="card"><h3>Match events</h3>${eventsHtml}</div>
    <div class="card"><h3>Match stats</h3>${statsHtml}</div>`;
}

/* =====================================================
   PART 5: DRAW THE PAGE
   ===================================================== */
function render() {
  if (state.offset === 0) updateBadge(state.matches);
  else document.getElementById("live-badge").textContent = "";

  syncLeagueSelect();

  if (state.openMatchId !== null) {
    const m = state.matches.find(x => x.id === state.openMatchId);
    if (m) {
      controls.hidden = true;
      app.innerHTML = renderMatch(m);
      return;
    }
    state.openMatchId = null;
  }
  controls.hidden = false;
  app.innerHTML = renderList();
}

/* =====================================================
   PART 6: CLICKS AND TYPING
   ===================================================== */
app.addEventListener("click", e => {
  const match = e.target.closest("[data-id]");
  if (match) {
    state.scrollY = window.scrollY;               // remember where we were in the list
    state.openMatchId = Number(match.dataset.id);
    render();
    window.scrollTo(0, 0);
    loadDetail(state.openMatchId);
    return;
  }
  if (e.target.closest("#back")) {
    state.openMatchId = null;
    render();
    window.scrollTo(0, state.scrollY);            // go back to the same spot
  }
});

searchBox.addEventListener("input", () => { state.search = searchBox.value; render(); });

leagueSelect.addEventListener("change", () => { state.league = leagueSelect.value; render(); });

document.getElementById("live-toggle").addEventListener("click", e => {
  state.liveOnly = !state.liveOnly;
  e.currentTarget.setAttribute("aria-pressed", String(state.liveOnly));
  render();
});

document.getElementById("dates").addEventListener("click", e => {
  const btn = e.target.closest("[data-off]");
  if (!btn) return;
  state.offset = Number(btn.dataset.off);
  document.querySelectorAll("#dates button").forEach(b =>
    b.setAttribute("aria-pressed", String(b === btn)));
  state.matches = [];
  state.lastJson = "";
  state.loading = true;
  render();
  refresh();
});

/* =====================================================
   PART 7: LIVE UPDATES
   Ask the backend again every 30 seconds (today only).
   The backend caches, so many visitors share the same API call.
   ===================================================== */
refresh();
setInterval(() => {
  if (state.offset === 0 && !document.hidden) refresh();
}, 30000);
</script>

</body>
</html>
